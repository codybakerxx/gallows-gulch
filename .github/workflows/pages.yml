# Builds the game on every push and checks the build. When GitHub Pages is switched on for the repository
# (Settings → Pages → Source: GitHub Actions), it also publishes dist/ there.
name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages: ${{ steps.pages.outputs.on }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: python3 build.py

      - name: Check the build
        run: python3 tools/check_build.py

      - name: Is GitHub Pages on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] && gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not publishing: turn on GitHub Pages under Settings → Pages (Source: GitHub Actions) to put the game online."
          fi

      - name: Package the site
        if: steps.pages.outputs.on == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
